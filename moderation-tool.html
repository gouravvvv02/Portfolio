<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Content Moderation Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0E14;
    --bg-1:#10141C;
    --panel:#131826;
    --panel-2:#171D2C;
    --border:#242B3D;
    --border-soft:#1B2130;
    --text-primary:#E7EAF2;
    --text-secondary:#8D95AC;
    --text-muted:#5C637A;
    --safe:#33B27A;
    --safe-bg:#12241D;
    --spam:#E5484D;
    --spam-bg:#2A1517;
    --review:#E9A23B;
    --review-bg:#2A2115;
    --accent:#5B8CFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(91,140,255,0.06), transparent 60%),
      var(--bg-0);
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:48px 24px 80px;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:36px;
  }

  .mark{
    width:38px;
    height:38px;
    border-radius:9px;
    background:linear-gradient(160deg, var(--accent), #2C4FBF);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .mark svg{width:19px;height:19px;}

  .title-block h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .title-block p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--text-secondary);
    font-family:'IBM Plex Mono', monospace;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
    margin-bottom:20px;
  }

  label.field-label{
    display:block;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-secondary);
    margin-bottom:10px;
  }

  textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    line-height:1.6;
    padding:14px 16px;
    outline:none;
    transition:border-color .15s ease;
  }
  textarea::placeholder{color:var(--text-muted);}
  textarea:focus{border-color:var(--accent);}

  .row-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    gap:16px;
  }

  .char-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-muted);
  }

  button#analyzeBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:9px;
    padding:12px 22px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:9px;
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  button#analyzeBtn:hover{background:#4A7AF0;}
  button#analyzeBtn:active{transform:scale(0.98);}

  #resultPanel{
    display:none;
  }

  .result-card{
    display:flex;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }

  .signal-bar{
    width:6px;
    flex-shrink:0;
    background:var(--text-muted);
  }
  .signal-bar.spam{background:var(--spam);}
  .signal-bar.safe{background:var(--safe);}
  .signal-bar.review{background:var(--review);}

  .result-body{
    padding:22px 24px;
    flex:1;
    min-width:0;
  }

  .result-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }

  .case-id{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }

  .decision-badge{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.04em;
    padding:6px 14px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .decision-badge.spam{background:var(--spam-bg);color:var(--spam);}
  .decision-badge.safe{background:var(--safe-bg);color:var(--safe);}
  .decision-badge.review{background:var(--review-bg);color:var(--review);}
  .decision-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}

  .reasoning-label{
    font-size:11.5px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-secondary);
    margin:0 0 8px;
  }
  .reasoning-text{
    font-size:14.5px;
    line-height:1.65;
    color:var(--text-primary);
    margin:0 0 20px;
  }

  .flags-box{
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:8px;
    padding:12px 14px;
    margin:16px 0;
    font-size:13px;
    line-height:1.5;
    color:var(--text-secondary);
  }

  .meta-row{
    display:flex;
    align-items:center;
    gap:24px;
    border-top:1px solid var(--border-soft);
    padding-top:16px;
    flex-wrap:wrap;
  }

  .meta-item{
    display:flex;
    flex-direction:column;
    gap:4px;
  }
  .meta-item .k{
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-muted);
  }
  .meta-item .v{
    font-family:'IBM Plex Mono', monospace;
    font-size:13px;
    font-weight:500;
  }
  .conf-High{color:var(--safe);}
  .conf-Medium{color:var(--review);}
  .conf-Low{color:var(--spam);}

  footer{
    text-align:center;
    margin-top:44px;
    font-size:12.5px;
    color:var(--text-muted);
    font-family:'IBM Plex Mono', monospace;
  }
  footer span{color:var(--text-secondary);}

  @media (max-width:520px){
    .row-bottom{flex-direction:column;align-items:stretch;}
    button#analyzeBtn{justify-content:center;}
  }
</style>
</head>
<body>

<div class="wrap">

  <header>
    <div class="mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 6.5V12C3 17 6.8 21.4 12 22.5C17.2 21.4 21 17 21 12V6.5L12 2Z" stroke="white" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M8.5 12.2L10.8 14.5L15.5 9.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title-block">
      <h1>Signal</h1>
      <p>content moderation triage assistant — Powered by Gaurav's Trust & Safety expertise</p>
    </div>
  </header>

  <div class="panel">
    <label class="field-label" for="contentInput">Content to review</label>
    <textarea id="contentInput" placeholder="Paste the post, comment, or message you want to check…"></textarea>
    <div class="row-bottom">
      <span class="char-count" id="charCount">0 characters</span>
      <button id="analyzeBtn">Analyze for Spam</button>
    </div>
  </div>

  <div id="resultPanel">
    <div class="result-card">
      <div class="signal-bar" id="signalBar"></div>
      <div class="result-body">
        <div class="result-top">
          <span class="case-id" id="caseId">CASE-0001</span>
          <span class="decision-badge" id="decisionBadge"><span class="dot"></span><span id="decisionText">—</span></span>
        </div>
        <p class="reasoning-label">Reasoning</p>
        <p class="reasoning-text" id="reasoningText">—</p>
        <div class="flags-box" id="flagsBox"></div>
        <div class="meta-row">
          <div class="meta-item">
            <span class="k">Confidence</span>
            <span class="v" id="confidenceText">—</span>
          </div>
          <div class="meta-item">
            <span class="k">Category</span>
            <span class="v" id="categoryText">—</span>
          </div>
          <div class="meta-item">
            <span class="k">Length</span>
            <span class="v" id="lengthText">—</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer>Built by <span>Gaurav</span> · Signal moderation assistant · Trust & Safety Edition</footer>
</div>

<script>
  // ========== YOUR SPAM KEYWORDS DATABASE ==========
  const spamDatabase = {
    telegram: ["join telegram", "telegram channel", "dm on telegram", "telegram group", "t.me", "telegram dm", "ping me on telegram", "telegram username", "telegram id", "message on telegram", "telegram link", "telegram chat", "telegram contact", "tg channel", "telegram exclusive", "telegram VIP", "telegram news", "telegram signals", "telegram tips", "telegram alert", "telegram bot", "telegram admin", "telegram owner", "telegram support", "telegram update", "telegram invite", "telegram join link", "telegram public group", "telegram private channel", "telegram paid group", "telegram premium content"],
    
    iptv: ["iptv", "m3u", "m3u8", "premium channels", "free streaming", "iptv subscription", "4k iptv", "iptv trial", "iptv service", "live tv streams", "sports package", "ppv streams", "iptv reseller", "firestick iptv", "smart tv iptv", "mag box", "enigma2", "best iptv", "cheap iptv", "iptv playlist", "xtream codes", "vod iptv", "catchup tv", "fhd streams", "stable iptv", "iptv panel", "iptv dashboard", "iptv client", "iptv server", "ott platform", "ott subscription", "live soccer", "live cricket", "live ufc", "live boxing", "all sports pack", "regional channels", "adult iptv", "xxx streams", "18+ channels", "uncensored iptv"],
    
    betting: ["bet365", "1xbet", "place your bet", "odds", "sports betting", "betting tips", "sure win", "fixed match", "accumulator bet", "betting exchange", "online casino", "slot machines", "live dealer", "blackjack online", "roulette live", "bet now", "register and get bonus", "high odds", "parlay bet", "betting promo", "deposit bonus", "free bet", "betting agent", "cricket betting", "football odds", "tennis betting", "basketball odds", "horse racing tips", "greyhound betting", "esports betting", "csgo betting", "dota 2 odds", "lol betting", "virtual sports", "betting accumulator", "treble bet", "each way bet", "betting strategy", "betting system", "arbitrage betting", "matched betting", "betting syndicate", "tipster", "betting forum", "betting community"],
    
    crypto: ["bitcoin", "btc", "ethereum", "eth", "usdt", "tether", "bnb", "solana", "crypto giveaway", "double your crypto", "free airdrop", "presale token", "moon coin", "pump and dump", "rug pull", "degen", "ape into", "crypto signals", "trading bot", "arbitrage bot", "flash loan", "defi yield", "staking rewards", "passive income crypto", "mining pool", "cloud mining", "hashrate", "mining contract", "investment fund", "hedge fund", "wealth manager", "portfolio growth", "guaranteed returns", "low risk high reward", "x100 profits", "smart contract", "audited token", "presale whitelist", "private sale", "crypto influencer", "pump group", "whale alerts", "buy the dip"],
    
    loan: ["instant loan", "urgent loan", "cash advance", "quick cash", "no credit check", "guaranteed approval", "payday loan", "personal loan", "business loan", "emergency loan", "loan offer", "apply for loan", "get funded", "loan agent", "debt consolidation", "bad credit loan", "same day loan", "low interest loan", "loan forgiveness", "student loan relief"],
    
    giveaway: ["free giveaway", "win iphone", "win macbook", "free laptop", "free gift card", "free amazon card", "free steam card", "free netflix", "free spotify", "free disney plus", "free paypal", "free crypto", "free money", "free cash", "claim your prize", "you won", "congratulations winner", "limited stock", "exclusive offer", "secret link", "unlock now"],
    
    phishing: ["verify your account", "confirm identity", "update payment", "security alert", "suspicious activity", "login attempt", "reset password", "click to verify", "urgent action required", "account suspended", "account locked", "reactivate account", "kyc verification", "id verification", "selfie verification", "bank details", "credit card info", "ssn", "social security", "passport scan", "driver license", "utility bill", "proof of address"],
    
    adult: ["cam girl", "live sex", "adult chat", "nsfw content", "onlyfans free", "onlyfans leak", "private show", "video call sex", "sexting", "nudes", "hookup now", "dating site", "casual encounter", "adult dating", "horny", "sex chat", "xxx video", "porn", "uncensored", "escort service", "massage parlor", "adult service"],
    
    workfromhome: ["work from home", "online job", "earn daily", "part time job", "data entry work", "copy paste job", "typing job", "online survey", "paid tasks", "micro job", "freelance opportunity", "instant payment", "daily payout", "referral income", "recruitment drive", "hiring now", "urgent vacancy", "work visa", "overseas job", "high salary", "free accommodation"],
    
    counterfeit: ["replica watches", "fake shoes", "knockoff bags", "counterfeit money", "fake ids", "fake passport", "driving license", "university degree", "fake diploma", "falsified documents", "undetectable counterfeit", "grade changer"],
    
    leetspeak: ["j0in", "t3l3gram", "dm m3", "fr33", "str3am", "pr3mium", "ch4nn3l", "b3t", "0dds", "c4s1n0", "sl0t", "b0nus", "gu4r4nt33d", "pr0f1t", "w1thdr4w", "v1p", "4cc3ss", "l1nk", "s3rv1c3", "p4ck4g3", "subscr1b3", "t0d4y", "w1n", "g1v3aw4y", "cl41m", "n0w", "4uth3nt1c", "crypt0", "b1tc01n", "eth3r3um", "st4k1ng", "y13ld", "l0an", "c4sh", "fr33 m0n3y", "3xclus1v3"],
    
    actionlinks: ["click link", "tap link", "visit site", "open url", "bit.ly", "tinyurl", "shorturl", "rebrandly", "ow.ly", "cutly", "is.gd", "rb.gy", "cutt.us", "shorte.st", "join now", "signup today", "register free", "activate now", "watch full", "download here", "get access", "unlock content"]
  };

  const categoryNames = {
    telegram: "Telegram/Contact Solicitation",
    iptv: "IPTV/Illegal Streaming",
    betting: "Gambling/Betting Sites",
    crypto: "Crypto/Investment Scams",
    loan: "Loan Scams",
    giveaway: "Fake Giveaways",
    phishing: "Phishing/Identity Theft",
    adult: "Adult/NSFW Content",
    workfromhome: "Work-from-Home Scams",
    counterfeit: "Counterfeit/Fake Products",
    leetspeak: "Obfuscated Text",
    actionlinks: "Suspicious Links"
  };

  const categoryWeights = {
    telegram: 1,
    iptv: 1.5,
    betting: 1.5,
    crypto: 2,
    loan: 2,
    giveaway: 1.5,
    phishing: 3,
    adult: 1.5,
    workfromhome: 1.5,
    counterfeit: 2,
    leetspeak: 0.5,
    actionlinks: 0.5
  };

  // ========== DOM ELEMENTS ==========
  const textarea = document.getElementById('contentInput');
  const charCount = document.getElementById('charCount');
  const analyzeBtn = document.getElementById('analyzeBtn');
  const resultPanel = document.getElementById('resultPanel');
  const signalBar = document.getElementById('signalBar');
  const decisionBadge = document.getElementById('decisionBadge');
  const decisionText = document.getElementById('decisionText');
  const reasoningText = document.getElementById('reasoningText');
  const flagsBox = document.getElementById('flagsBox');
  const confidenceText = document.getElementById('confidenceText');
  const categoryText = document.getElementById('categoryText');
  const lengthText = document.getElementById('lengthText');
  const caseId = document.getElementById('caseId');

  let caseNumber = 1;

  textarea.addEventListener('input', () => {
    charCount.textContent = textarea.value.length + ' characters';
  });

  analyzeBtn.addEventListener('click', analyzeContent);

  function analyzeContent(){
    const content = textarea.value.trim().toLowerCase();

    if(!content){
      alert('Paste some content first.');
      return;
    }

    resultPanel.style.display = 'none';

    let totalScore = 0;
    let detectedCategories = [];
    let allFlags = [];

    // Check each category
    for(let category in spamDatabase){
      let categoryScore = 0;
      let categoryFlags = [];

      spamDatabase[category].forEach(keyword => {
        if(content.includes(keyword)){
          categoryScore += categoryWeights[category];
          categoryFlags.push(keyword);
        }
      });

      if(categoryScore > 0){
        detectedCategories.push({category, score: categoryScore, flags: categoryFlags});
        totalScore += categoryScore;
        allFlags = allFlags.concat(categoryFlags.slice(0, 2));
      }
    }

    // Determine decision
    let decision, confidence, reasoning, topCategory;

    if(totalScore >= 4){
      decision = 'SPAM';
      confidence = 'High';
      topCategory = detectedCategories.sort((a,b) => b.score - a.score)[0];
      reasoning = `Multiple critical spam signals detected from ${categoryNames[topCategory.category]}. This content poses a Trust & Safety risk.`;
    } else if(totalScore >= 2){
      decision = 'NEEDS REVIEW';
      confidence = 'Medium';
      topCategory = detectedCategories.sort((a,b) => b.score - a.score)[0];
      reasoning = `Moderate spam indicators detected. Content requires manual review for policy compliance.`;
    } else if(totalScore >= 0.5){
      decision = 'NEEDS REVIEW';
      confidence = 'Low';
      topCategory = detectedCategories.sort((a,b) => b.score - a.score)[0];
      reasoning = `Minor spam signals present. Likely safe but warrants review.`;
    } else {
      decision = 'SAFE';
      confidence = 'High';
      reasoning = 'No spam indicators detected. Content appears legitimate and safe.';
      topCategory = null;
    }

    renderResult({decision, reasoning, confidence, topCategory, allFlags, detectedCategories}, content);
  }

  function renderResult(result, originalContent){
    const decision = result.decision;
    const confidence = result.confidence;
    const reasoning = result.reasoning;
    const topCategory = result.topCategory;
    const allFlags = result.allFlags;

    let cls = 'review';
    if(decision === 'SPAM') cls = 'spam';
    else if(decision === 'SAFE') cls = 'safe';

    signalBar.className = 'signal-bar ' + cls;
    decisionBadge.className = 'decision-badge ' + cls;
    decisionText.textContent = decision;
    reasoningText.textContent = reasoning;
    confidenceText.textContent = confidence;
    confidenceText.className = 'v conf-' + confidence;
    lengthText.textContent = originalContent.length + ' chars';
    
    if(topCategory){
      categoryText.textContent = categoryNames[topCategory.category];
    } else {
      categoryText.textContent = 'None';
    }

    // Show detected flags
    if(allFlags.length > 0){
      flagsBox.innerHTML = '<strong>Detected:</strong> ' + allFlags.slice(0, 3).join(', ');
    } else {
      flagsBox.innerHTML = '<strong>Flags:</strong> None detected';
    }

    caseId.textContent = 'CASE-' + String(caseNumber).padStart(4, '0');
    caseNumber++;

    resultPanel.style.display = 'block';
  }
</script>

</body>
</html>
