<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Signal — Content Moderation Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-0:#0A0E14;
    --bg-1:#10141C;
    --panel:#131826;
    --panel-2:#171D2C;
    --border:#242B3D;
    --border-soft:#1B2130;
    --text-primary:#E7EAF2;
    --text-secondary:#8D95AC;
    --text-muted:#5C637A;
    --safe:#33B27A;
    --safe-bg:#12241D;
    --spam:#E5484D;
    --spam-bg:#2A1517;
    --review:#E9A23B;
    --review-bg:#2A2115;
    --accent:#5B8CFF;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(91,140,255,0.06), transparent 60%),
      var(--bg-0);
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    min-height:100vh;
    padding:48px 24px 80px;
  }

  .wrap{
    max-width:760px;
    margin:0 auto;
  }

  header{
    display:flex;
    align-items:center;
    gap:14px;
    margin-bottom:36px;
  }

  .mark{
    width:38px;
    height:38px;
    border-radius:9px;
    background:linear-gradient(160deg, var(--accent), #2C4FBF);
    display:flex;
    align-items:center;
    justify-content:center;
    flex-shrink:0;
  }
  .mark svg{width:19px;height:19px;}

  .title-block h1{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:22px;
    margin:0;
    letter-spacing:-0.01em;
  }
  .title-block p{
    margin:2px 0 0;
    font-size:13px;
    color:var(--text-secondary);
    font-family:'IBM Plex Mono', monospace;
  }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    padding:24px;
    margin-bottom:20px;
  }

  label.field-label{
    display:block;
    font-size:12px;
    font-weight:600;
    text-transform:uppercase;
    letter-spacing:0.06em;
    color:var(--text-secondary);
    margin-bottom:10px;
  }

  textarea{
    width:100%;
    min-height:160px;
    resize:vertical;
    background:var(--bg-1);
    border:1px solid var(--border);
    border-radius:10px;
    color:var(--text-primary);
    font-family:'Inter', sans-serif;
    font-size:14.5px;
    line-height:1.6;
    padding:14px 16px;
    outline:none;
    transition:border-color .15s ease;
  }
  textarea::placeholder{color:var(--text-muted);}
  textarea:focus{border-color:var(--accent);}

  .row-bottom{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:16px;
    gap:16px;
  }

  .char-count{
    font-family:'IBM Plex Mono', monospace;
    font-size:12px;
    color:var(--text-muted);
  }

  button#analyzeBtn{
    background:var(--accent);
    color:#fff;
    border:none;
    border-radius:9px;
    padding:12px 22px;
    font-family:'Inter', sans-serif;
    font-weight:600;
    font-size:14px;
    cursor:pointer;
    display:flex;
    align-items:center;
    gap:9px;
    transition:background .15s ease, transform .1s ease;
    white-space:nowrap;
  }
  button#analyzeBtn:hover{background:#4A7AF0;}
  button#analyzeBtn:active{transform:scale(0.98);}

  #resultPanel{
    display:none;
  }

  .result-card{
    display:flex;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:14px;
    overflow:hidden;
  }

  .signal-bar{
    width:6px;
    flex-shrink:0;
    background:var(--text-muted);
  }
  .signal-bar.spam{background:var(--spam);}
  .signal-bar.safe{background:var(--safe);}
  .signal-bar.review{background:var(--review);}

  .result-body{
    padding:22px 24px;
    flex:1;
    min-width:0;
  }

  .result-top{
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:10px;
    margin-bottom:16px;
  }

  .case-id{
    font-family:'IBM Plex Mono', monospace;
    font-size:11.5px;
    color:var(--text-muted);
    letter-spacing:0.03em;
  }

  .decision-badge{
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    letter-spacing:0.04em;
    padding:6px 14px;
    border-radius:999px;
    display:inline-flex;
    align-items:center;
    gap:7px;
  }
  .decision-badge.spam{background:var(--spam-bg);color:var(--spam);}
  .decision-badge.safe{background:var(--safe-bg);color:var(--safe);}
  .decision-badge.review{background:var(--review-bg);color:var(--review);}
  .decision-badge .dot{width:7px;height:7px;border-radius:50%;background:currentColor;}
